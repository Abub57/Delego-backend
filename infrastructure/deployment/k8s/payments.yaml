# Payments Deployment & Service (Issue #76)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: delego-payments
  labels:
    app: delego
    service: payments
spec:
  replicas: 2
  selector:
    matchLabels:
      app: delego
      service: payments
  template:
    metadata:
      labels:
        app: delego
        service: payments
    spec:
      containers:
        - name: payments
          image: ghcr.io/delegolabs/delego-backend/payments:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3014
          env:
            - name: NODE_ENV
              value: production
            - name: PAYMENTS_PORT
              value: "3014"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: delego-db
                  key: database-url
            - name: ORCHESTRATOR_PAYMENTS_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: delego-service-auth
                  key: orchestrator-payments-service-token
            - name: PAYMENTS_WALLET_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: delego-service-auth
                  key: payments-wallet-service-token
            - name: WALLET_SERVICE_URL
              value: http://delego-wallet:3012
            - name: SOROBAN_RPC_URL
              valueFrom:
                secretKeyRef:
                  name: delego-stellar
                  key: soroban-rpc-url
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: delego-payments
  labels:
    app: delego
    service: payments
spec:
  selector:
    app: delego
    service: payments
  ports:
    - name: http
      port: 3014
      targetPort: http
