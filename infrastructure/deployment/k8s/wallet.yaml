# Wallet Deployment & Service (Issue #76)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: delego-wallet
  labels:
    app: delego
    service: wallet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: delego
      service: wallet
  template:
    metadata:
      labels:
        app: delego
        service: wallet
    spec:
      containers:
        - name: wallet
          image: ghcr.io/delegolabs/delego-backend/wallet:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3012
            - name: ws
              containerPort: 3013
          env:
            - name: NODE_ENV
              value: production
            - name: WALLET_PORT
              value: "3012"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: delego-db
                  key: database-url
            - name: PAYMENTS_WALLET_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: delego-service-auth
                  key: payments-wallet-service-token
            - name: ESCROW_CONTRACT_ID
              valueFrom:
                secretKeyRef:
                  name: delego-stellar
                  key: escrow-contract-id
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: delego-redis
                  key: url
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: delego-wallet
  labels:
    app: delego
    service: wallet
spec:
  selector:
    app: delego
    service: wallet
  ports:
    - name: http
      port: 3012
      targetPort: http
    - name: ws
      port: 3013
      targetPort: ws
