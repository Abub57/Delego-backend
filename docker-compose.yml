# Delego local development infrastructure
# Usage: docker compose up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: delego-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: delego
      POSTGRES_PASSWORD: delego
      POSTGRES_DB: delego
    # Logical replication settings required by the CDC service
    # (@delegolabs/cdc). `wal_level=logical` must be set before the first
    # start; changing it later requires recreating the volume.
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema:/docker-entrypoint-initdb.d/schema:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delego -d delego"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: delego-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # TODO: Add Soroban local network container when contract dev loop is defined
  # soroban:
  #   image: stellar/quickstart:testing
  #   ...

volumes:
  postgres_data:
  redis_data:
